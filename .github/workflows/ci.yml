name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Tipos, build e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Build de produção
        run: npm run build

      # Sem o emulador do Firestore, os testes de regras/nuvem são ignorados;
      # a suíte de domínio, relatório e segurança roda integralmente.
      - name: Testes
        run: npm test
